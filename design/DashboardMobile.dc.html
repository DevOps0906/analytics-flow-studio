<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대시보드 · 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#F4F7F8;--ink:#0F172A;--sub:#475569;--mut:#536274;--line:#E2E8F0;--pri:#007A64;--mint:#00C9A7;--denim:#2563EB;--amber:#F59E0B;--coral:#F43F5E;--fb:14px;--ft:20px;--fk:24px;--fs:12px;--gut:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:var(--fb);line-height:1.5}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:var(--fs);color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.h1{margin:0;font-size:var(--ft);font-weight:700;line-height:1.25}
.h3{margin:0;font-size:var(--fb);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 14px;border-radius:8px;border:1px solid #CBD5E1;background:#fff;color:var(--ink);font:inherit;font-size:var(--fs);font-weight:500;cursor:pointer}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;background:#FEF3C7;color:#78350F;font-size:var(--fs);font-weight:500}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid #CBD5E1;background:#fff;font-size:var(--fs)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{font-size:var(--fk);font-weight:700;overflow-wrap:anywhere}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);text-decoration:none;font-size:11px}
.tab.on{color:#00574A;font-weight:700}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px; background: #F4F7F8; display: flex; flex-direction: column; position: relative">
<header style="display: flex; align-items: center; gap: 10px; padding: 10px var(--gut); background: #fff; border-bottom: 1px solid var(--line)">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #007A64; display: inline-flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
</span>
<strong style="flex: 1">[프로젝트명]</strong>
<button class="btn" type="button" aria-label="메뉴 열기">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</header>
<main style="padding: var(--gut); display: flex; flex-direction: column; gap: 12px; flex: 1">
<div>
<h1 class="h1">월간 매출 대시보드</h1>
<span class="badge" style="margin-top: 6px">샘플 데이터</span>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="3"><span class="chip">{{ c }}</span></sc-for>
</div>
<section class="card" aria-label="AI 요약" style="background: #F0FDFA; border-color: #9FE8D8">
<h2 class="h3">AI 요약</h2>
<p style="margin: 4px 0 0">매출과 광고 효율이 함께 개선되었습니다. 채널 A가 성장을 이끌었습니다. (예시 문장)</p>
</section>
<section class="kpis" aria-label="핵심 지표">
<sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
<div class="card"><div class="lbl">{{ k.label }}</div><div class="kpi mono" style="margin-top: 2px; font-size: {{ k.size }}">{{ k.value }}</div></div>
</sc-for>
</section>
<section class="card" aria-label="일별 매출 추이">
<h2 class="h3" style="margin-bottom: 8px">일별 매출 추이</h2>
<svg viewBox="0 0 330 150" width="100%" role="img" aria-label="일별 매출 선 그래프(샘플)" style="display: block">
<g stroke="#E2E8F0"><line x1="10" y1="20" x2="320" y2="20"></line><line x1="10" y1="65" x2="320" y2="65"></line><line x1="10" y1="110" x2="320" y2="110"></line></g>
<polyline fill="none" stroke="#00A98C" stroke-width="2.5" points="10,115 48,106 86,110 124,84 162,88 200,70 238,62 276,66 320,44"></polyline>
<polyline fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" points="10,124 48,122 86,119 124,112 162,110 200,103 238,100 276,96 320,90"></polyline>
</svg>
</section>
<section class="card" aria-label="채널별 비중">
<h2 class="h3" style="margin-bottom: 10px">채널별 비중</h2>
<div style="display: flex; align-items: center; gap: 14px">
<div role="img" aria-label="채널별 비중 도넛(샘플)" style="width: 100px; height: 100px; flex: 0 0 100px; border-radius: 50%; background: conic-gradient(#00A98C 0 45%, #2563EB 45% 75%, #F59E0B 75% 92%, #CBD5E1 92% 100%); display: flex; align-items: center; justify-content: center"><div style="width: 56px; height: 56px; background: #fff; border-radius: 50%"></div></div>
<ul style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{ channels }}" as="c" hint-placeholder-count="4"><li style="display: flex; align-items: center; gap: 6px; font-size: var(--fs)"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{ c.color }}"></span>{{ c.name }} <span class="mono">{{ c.pct }}</span></li></sc-for>
</ul>
</div>
</section>
<section class="card" aria-label="채널별 ROAS">
<h2 class="h3" style="margin-bottom: 10px">채널별 ROAS</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 8px; font-size: var(--fs)"><span style="width: 52px">{{ b.name }}</span><div style="flex: 1; height: 10px; background: #EEF2F5; border-radius: 5px"><div style="height: 10px; border-radius: 5px; background: #00A98C; width: {{ b.w }}"></div></div><span class="mono" style="width: 32px; text-align: right">{{ b.v }}</span></div></sc-for>
</div>
</section>
<section class="card" aria-label="상위 상품">
<h2 class="h3" style="margin-bottom: 6px">상위 상품</h2>
<sc-for list="{{ products }}" as="p" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #E2E8F0"><span>{{ p.name }}</span><span class="mono">{{ p.v }}</span></div></sc-for>
</section>
<p class="lbl" style="margin: 0 0 140px">※ 모든 수치는 샘플이며 실제 데이터가 아닙니다.</p>
</main>
<button class="btn" type="button" style="position: absolute; right: 16px; bottom: 76px; min-height: 52px; border-radius: 26px; background: #007A64; border-color: #007A64; color: #fff; padding: 0 18px; font-size: 14px">AI에게 말하기</button>
<nav aria-label="하단 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: #fff; border-top: 1px solid var(--line)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<a class="tab {{ t.cls }}" href="{{ t.href }}" aria-current="{{ t.cur }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg>
<span>{{ t.label }}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
